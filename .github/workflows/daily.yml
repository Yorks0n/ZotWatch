name: ZotWatch daily compute and RSS

on:
  workflow_call:
    inputs:
      config-path:
        type: string
        default: zotwatch.yaml
      mode:
        type: string
        default: run
      full-rebuild:
        type: boolean
        default: false
      request-id:
        type: string
        default: ""
      expected-config-sha:
        type: string
        default: ""
      candidate-policy:
        type: string
        default: center-recall-v1
    secrets:
      ZOTWATCH_PUBLISH_TOKEN:
        required: true
      ZOTERO_USER_ID:
        required: false
      ZOTERO_API_KEY:
        required: false
      LLM_API_KEY:
        required: false
      TYPESAFE_API_KEY:
        required: false
      ZOTWATCH_COMPATIBLE_API_KEY:
        required: false
      OPENALEX_API_KEY:
        required: false
      VOYAGE_API_KEY:
        required: false
      DASHSCOPE_API_KEY:
        required: false
      OPENROUTER_API_KEY:
        required: false
      DEEPSEEK_API_KEY:
        required: false
      OPENAI_API_KEY:
        required: false
      ANTHROPIC_API_KEY:
        required: false
      ZOTWATCH_CUSTOM_1_CREDENTIAL:
        required: false
      ZOTWATCH_CUSTOM_2_CREDENTIAL:
        required: false
      ZOTWATCH_CUSTOM_3_CREDENTIAL:
        required: false
      ZOTWATCH_CUSTOM_4_CREDENTIAL:
        required: false
    outputs:
      result-status:
        value: ${{ jobs.compute.outputs.result-status }}
      run-id:
        value: ${{ jobs.compute.outputs.run-id }}
      request-id:
        value: ${{ jobs.compute.outputs.request-id }}
      engine-sha:
        value: ${{ jobs.compute.outputs.engine-sha }}
      publish-requested:
        value: ${{ jobs.compute.outputs.publish-requested }}

permissions: {}

jobs:
  compute:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: write
    concurrency:
      group: zotwatch-${{ github.repository_id }}-${{ github.workflow_ref }}-${{ github.ref }}
      cancel-in-progress: false
    outputs:
      result-status: ${{ steps.aggregate.outputs.result-status }}
      run-id: ${{ steps.aggregate.outputs.run-id }}
      request-id: ${{ steps.request.outputs.request-id }}
      engine-sha: ${{ steps.identity.outputs.engine-sha }}
      publish-requested: ${{ steps.config.outputs.publish-requested }}
    steps:
      - name: Validate caller boundary
        env:
          CALLER_EVENT: ${{ github.event_name }}
          CALLER_PRIVATE: ${{ github.event.repository.private }}
          CALLER_REF: ${{ github.ref }}
          INPUT_MODE: ${{ inputs.mode }}
          INPUT_FULL: ${{ inputs['full-rebuild'] }}
          INPUT_CANDIDATE_POLICY: ${{ inputs['candidate-policy'] }}
        shell: bash
        run: |
          set -euo pipefail
          python -c 'import os,sys; ok=os.environ["CALLER_EVENT"] in {"schedule","workflow_dispatch"} and os.environ["CALLER_PRIVATE"] == "true" and os.environ["CALLER_REF"].startswith("refs/heads/") and os.environ["INPUT_MODE"] in {"run","profile","validate"} and os.environ["INPUT_CANDIDATE_POLICY"] in {"center-recall-v1"} and not (os.environ["INPUT_MODE"] == "validate" and os.environ["INPUT_FULL"] == "true"); sys.exit(0 if ok else "untrusted or invalid reusable-workflow invocation")'

      - name: Checkout personal workspace
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: ${{ github.repository }}
          ref: ${{ github.sha }}
          path: workspace
          persist-credentials: false

      - name: Checkout exact central engine
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: engine
          persist-credentials: false

      - name: Set up pinned Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: 3.11.11
          cache: pip
          cache-dependency-path: |
            engine/constraints/p2-runtime-linux-py311.txt
            engine/pyproject.toml

      - name: Install pinned validation runtime
        if: inputs.mode == 'validate'
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --constraint engine/constraints/p2-runtime-linux-py311.txt pydantic PyYAML jsonschema python-dotenv requests
          python -m pip install --disable-pip-version-check --no-deps ./engine

      - name: Install pinned engine runtime
        if: inputs.mode != 'validate'
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check torch==2.14.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install --disable-pip-version-check --constraint engine/constraints/p2-runtime-linux-py311.txt ./engine

      - name: Verify reusable workflow and engine identity
        id: identity
        shell: bash
        run: >-
          python -m zotwatch.workflow identity
          --workflow-repository '${{ job.workflow_repository }}'
          --workflow-sha '${{ job.workflow_sha }}'
          --engine "$GITHUB_WORKSPACE/engine"
          --github-output

      - name: Validate request correlation
        id: request
        env:
          INPUT_REQUEST_ID: ${{ inputs['request-id'] }}
          FALLBACK_REQUEST_ID: ${{ github.run_id }}-${{ github.run_attempt }}
        shell: bash
        run: |
          set -euo pipefail
          python -c 'import os,re; v=os.environ["INPUT_REQUEST_ID"] or os.environ["FALLBACK_REQUEST_ID"]; assert re.fullmatch(r"[A-Za-z0-9][A-Za-z0-9._-]{0,127}",v); open(os.environ["GITHUB_OUTPUT"],"a",encoding="utf-8").write(f"request-id={v}\n")'

      - name: Validate and inspect config offline
        id: config
        env:
          INPUT_CONFIG_PATH: ${{ inputs['config-path'] }}
          INPUT_EXPECTED_CONFIG_SHA: ${{ inputs['expected-config-sha'] }}
        shell: bash
        run: >-
          python -m zotwatch.workflow inspect-config
          --workspace "$GITHUB_WORKSPACE/workspace"
          --config-path "$INPUT_CONFIG_PATH"
          --expected-config-sha "$INPUT_EXPECTED_CONFIG_SHA"
          --mode '${{ inputs.mode }}'
          --full-rebuild '${{ inputs['full-rebuild'] }}'
          --github-output

      - name: Check daily recommendation configuration
        if: inputs.mode != 'validate'
        env:
          RANKING_POLICY: ${{ steps.config.outputs.ranking-policy }}
          CANDIDATE_POLICY: ${{ inputs['candidate-policy'] }}
        shell: bash
        run: |
          test "$RANKING_POLICY" = latent-auto-v1
          test "$CANDIDATE_POLICY" = center-recall-v1

      - name: Validate config only
        if: inputs.mode == 'validate'
        shell: bash
        run: zotwatch config validate --workspace "$GITHUB_WORKSPACE/workspace"

      - name: Restore latest private state cache
        if: inputs.mode != 'validate'
        id: state-cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ${{ runner.temp }}/zotwatch-cache
          key: zotwatch-daily-${{ github.repository_id }}-${{ github.ref_name }}-v1-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: zotwatch-daily-${{ github.repository_id }}-${{ github.ref_name }}-v1-

      - name: Install current cached state or rebuild on a miss
        if: inputs.mode != 'validate'
        env:
          ZOTERO_USER_ID: ${{ secrets.ZOTERO_USER_ID }}
        run: python -m zotwatch.workflow.daily_cache restore --state "$RUNNER_TEMP/zotwatch-state" --cache "$RUNNER_TEMP/zotwatch-cache"

      - name: Deliver exact generic MiniLM encoder
        if: inputs.mode != 'validate'
        shell: bash
        run: >-
          python -m zotwatch.interests.lifecycle_transport encoder
          --cache "$RUNNER_TEMP/zotwatch-encoder/hub"

      - name: Run engine
        if: inputs.mode != 'validate'
        id: invoke
        env:
          ZOTWATCH_PRIVATE_FILTER_DIAGNOSTIC: "1"
          GITHUB_TOKEN: ${{ github.token }}
          INPUT_RANKING_POLICY: ${{ steps.config.outputs.ranking-policy }}
          OPENALEX_API_KEY: ${{ secrets.OPENALEX_API_KEY }}
          ZOTERO_USER_ID: ${{ secrets.ZOTERO_USER_ID }}
          ZOTERO_API_KEY: ${{ secrets.ZOTERO_API_KEY }}
          VOYAGE_API_KEY: ${{ secrets.VOYAGE_API_KEY }}
          DASHSCOPE_API_KEY: ${{ secrets.DASHSCOPE_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ZOTWATCH_CUSTOM_1_CREDENTIAL: ${{ secrets.ZOTWATCH_CUSTOM_1_CREDENTIAL }}
          ZOTWATCH_CUSTOM_2_CREDENTIAL: ${{ secrets.ZOTWATCH_CUSTOM_2_CREDENTIAL }}
          ZOTWATCH_CUSTOM_3_CREDENTIAL: ${{ secrets.ZOTWATCH_CUSTOM_3_CREDENTIAL }}
          ZOTWATCH_CUSTOM_4_CREDENTIAL: ${{ secrets.ZOTWATCH_CUSTOM_4_CREDENTIAL }}
          INPUT_MODE: ${{ inputs.mode }}
          INPUT_FULL: ${{ inputs['full-rebuild'] }}
          INPUT_CANDIDATE_POLICY: ${{ inputs['candidate-policy'] }}
        shell: bash
        run: |
          set +e
          export HF_HUB_CACHE="$RUNNER_TEMP/zotwatch-encoder/hub"
          export HF_HUB_OFFLINE=1 TRANSFORMERS_OFFLINE=1
          command=watch
          extra=(--latent-lifecycle per-user-v1 --latent-encoder-cache "$RUNNER_TEMP/zotwatch-encoder/hub")
          if [[ "$INPUT_FULL" == "true" ]]; then extra+=(--full); fi
          if [[ "$INPUT_MODE" == "profile" ]]; then
            command=profile
            if [[ "$INPUT_FULL" == "true" ]]; then extra+=(--full); fi
          fi
          if [[ "$command" == "watch" && "$INPUT_CANDIDATE_POLICY" == "center-recall-v1" ]]; then
            extra+=(--candidate-policy center-recall-v1)
            export HF_HUB_CACHE="$RUNNER_TEMP/zotwatch-encoder/hub"
            export HF_HUB_OFFLINE=1 TRANSFORMERS_OFFLINE=1
          fi
          zotwatch "$command" --workspace "$GITHUB_WORKSPACE/workspace" --state-dir "$RUNNER_TEMP/zotwatch-state" --reports-dir "$RUNNER_TEMP/zotwatch-reports" --machine-result "${extra[@]}" >"$RUNNER_TEMP/machine-result.json" 2>"$RUNNER_TEMP/engine.stderr"
          code=$?
          echo "exit-code=$code" >>"$GITHUB_OUTPUT"
          exit 0

      - name: Read this job's recommendation status
        if: steps.invoke.outcome == 'success'
        id: result
        env:
          ENGINE_EXIT_CODE: ${{ steps.invoke.outputs.exit-code }}
        run: |
          python - <<'PYCODE'
          import json, os
          from pathlib import Path
          result = json.loads((Path(os.environ['RUNNER_TEMP']) / 'machine-result.json').read_bytes())
          if result.get('schema_name') != 'zotwatch-latent-auto-run-result' or result.get('exit_code') != int(os.environ['ENGINE_EXIT_CODE']):
              raise ValueError('Invalid local engine result')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              for name in ('status', 'run_id'):
                  value = result[name]
                  if not isinstance(value, str) or '\n' in value or '\r' in value:
                      raise ValueError('Invalid local result field')
                  output.write(name.replace('_', '-') + '=' + value + '\n')
          PYCODE

      - name: Apply optional AI delivery after original Top 20
        if: inputs.mode == 'run' && steps.result.outputs.status == 'succeeded'
        env:
          LLM_API_FORMAT: ${{ vars.LLM_API_FORMAT || 'openai' }}
          LLM_BASE_URL: ${{ vars.LLM_BASE_URL }}
          LLM_MODEL: ${{ vars.LLM_MODEL }}
          LLM_TRANSLATION_MODEL: ${{ vars.LLM_TRANSLATION_MODEL }}
          LLM_SHADOW_MODEL: ${{ vars.LLM_SHADOW_MODEL }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          ZOTWATCH_COMPATIBLE_API_KEY: ${{ secrets.ZOTWATCH_COMPATIBLE_API_KEY }}
        shell: bash
        run: >-
          python -m zotwatch.staging_ai
          --config "$GITHUB_WORKSPACE/workspace/zotwatch-optional-ai.yaml"
          --result "$RUNNER_TEMP/machine-result.json"
          --state "$RUNNER_TEMP/zotwatch-state"
          --destination "$RUNNER_TEMP/zotwatch-operational"
          --encoder-cache "$RUNNER_TEMP/zotwatch-encoder/hub"

      - name: Select authoritative result
        id: aggregate
        env:
          MODE: ${{ inputs.mode }}
          MAIN_STATUS: ${{ steps.result.outputs.status }}
          MAIN_RUN_ID: ${{ steps.result.outputs.run-id }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$MODE" == "validate" ]]; then
            echo "result-status=succeeded" >>"$GITHUB_OUTPUT"
            echo "run-id=" >>"$GITHUB_OUTPUT"
          elif [[ -n "$MAIN_STATUS" ]]; then
            echo "result-status=$MAIN_STATUS" >>"$GITHUB_OUTPUT"
            echo "run-id=$MAIN_RUN_ID" >>"$GITHUB_OUTPUT"
          else
            echo "result-status=failed" >>"$GITHUB_OUTPUT"
            echo "run-id=" >>"$GITHUB_OUTPUT"
          fi

      - name: Prepare public RSS and reading pages from local results
        if: inputs.mode == 'run' && steps.aggregate.outputs.result-status == 'succeeded'
        run: >-
          python engine/scripts/daily_pages.py prepare
          --config workspace/zotwatch-rss.json
          --result "$RUNNER_TEMP/machine-result.json"
          --delivery "$RUNNER_TEMP/zotwatch-operational/rss-ai-v1.json"
          --destination "$RUNNER_TEMP/zotwatch-pages"
          --previous "$RUNNER_TEMP/zotwatch-state/public-feed.xml"

      - name: Snapshot only current reusable state
        if: always() && !cancelled() && inputs.mode != 'validate' && steps.aggregate.outputs.result-status == 'succeeded'
        id: snapshot
        env:
          ZOTERO_USER_ID: ${{ secrets.ZOTERO_USER_ID }}
        run: python -m zotwatch.workflow.daily_cache save --state "$RUNNER_TEMP/zotwatch-state" --cache "$RUNNER_TEMP/zotwatch-cache"

      - name: Save newest private state
        if: always() && !cancelled() && steps.snapshot.outcome == 'success'
        id: save-cache
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ${{ runner.temp }}/zotwatch-cache
          key: zotwatch-daily-${{ github.repository_id }}-${{ github.ref_name }}-v1-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Remove superseded state caches after successful save
        if: always() && steps.save-cache.outcome == 'success'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          KEEP_CACHE_KEY: zotwatch-daily-${{ github.repository_id }}-${{ github.ref_name }}-v1-${{ github.run_id }}-${{ github.run_attempt }}
          CACHE_PREFIX: zotwatch-daily-${{ github.repository_id }}-${{ github.ref_name }}-v1-
        run: |
          gh api --paginate "repos/$GITHUB_REPOSITORY/actions/caches?per_page=100" --jq '.actions_caches[] | [.id, .key] | @tsv' > "$RUNNER_TEMP/cache-list.tsv"
          # save-cache can report success after a service warning. Never remove
          # the previous cache until the replacement is visible in GitHub.
          python - <<'PYCODE'
          import os, subprocess
          rows = [line.rstrip('\n').split('\t') for line in open(os.environ['RUNNER_TEMP'] + '/cache-list.tsv')]
          keep = os.environ['KEEP_CACHE_KEY']
          if not any(len(row) == 2 and row[1] == keep for row in rows):
              raise SystemExit(0)
          for cache_id, key in rows:
              if key != keep and key.startswith(os.environ['CACHE_PREFIX']):
                  subprocess.run(['gh', 'api', '--method', 'DELETE', 'repos/' + os.environ['GITHUB_REPOSITORY'] + '/actions/caches/' + cache_id], check=True)
          PYCODE

      - name: Upload only public reading pages for delivery
        if: inputs.mode == 'run' && steps.aggregate.outputs.result-status == 'succeeded'
        id: upload-pages
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: zotwatch-public-pages
          path: ${{ runner.temp }}/zotwatch-pages
          if-no-files-found: error
          retention-days: 1
          overwrite: true

      - name: Request deployment in the public results repository
        if: steps.upload-pages.outputs.artifact-id != ''
        env:
          ZOTWATCH_PUBLISH_TOKEN: ${{ secrets.ZOTWATCH_PUBLISH_TOKEN }}
        run: >-
          python engine/scripts/daily_pages.py notify
          --config workspace/zotwatch-rss.json
          --artifact-id '${{ steps.upload-pages.outputs.artifact-id }}'

      - name: Propagate engine result
        if: inputs.mode != 'validate' && steps.aggregate.outputs.result-status != 'succeeded' && steps.aggregate.outputs.result-status != 'not_ready' && steps.aggregate.outputs.result-status != 'paused'
        run: exit 1
