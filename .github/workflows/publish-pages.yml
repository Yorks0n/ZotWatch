name: ZotWatch reusable Pages publication

on:
  workflow_call:
    inputs:
      run-id:
        type: string
        required: true
      manifest-artifact-id:
        type: string
        required: true
      report-artifact-id:
        type: string
        required: true
      expected-engine-sha:
        type: string
        required: true
    outputs:
      publication-url:
        value: ${{ jobs.publish.outputs.publication-url }}

permissions: {}

jobs:
  publish:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      publication-url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout exact central engine
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: engine
          persist-credentials: false

      - name: Set up pinned Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: 3.11.11
          cache: pip
          cache-dependency-path: |
            engine/constraints/p2-runtime-linux-py311.txt
            engine/pyproject.toml

      - name: Install pinned publication runtime
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --constraint engine/constraints/p2-runtime-linux-py311.txt pydantic
          python -m pip install --disable-pip-version-check --no-deps ./engine

      - name: Verify reusable workflow and engine identity
        shell: bash
        run: >-
          python -m zotwatch.workflow identity
          --workflow-repository '${{ job.workflow_repository }}'
          --workflow-sha '${{ job.workflow_sha }}'
          --engine "$GITHUB_WORKSPACE/engine"

      - name: Verify deployment inputs
        env:
          EXPECTED_ENGINE_SHA: ${{ inputs['expected-engine-sha'] }}
          ACTUAL_ENGINE_SHA: ${{ job.workflow_sha }}
          RUN_ID: ${{ inputs['run-id'] }}
          MANIFEST_ARTIFACT_ID: ${{ inputs['manifest-artifact-id'] }}
          REPORT_ARTIFACT_ID: ${{ inputs['report-artifact-id'] }}
        shell: bash
        run: |
          set -euo pipefail
          python -c 'import os,re; assert os.environ["EXPECTED_ENGINE_SHA"] == os.environ["ACTUAL_ENGINE_SHA"] and re.fullmatch(r"[0-9a-f]{40}",os.environ["ACTUAL_ENGINE_SHA"]) and re.fullmatch(r"[A-Za-z0-9][A-Za-z0-9._-]{0,127}",os.environ["RUN_ID"]) and re.fullmatch(r"[1-9][0-9]*",os.environ["MANIFEST_ARTIFACT_ID"]) and re.fullmatch(r"[1-9][0-9]*",os.environ["REPORT_ARTIFACT_ID"])'

      - name: Download exact private operational artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          artifact-ids: ${{ inputs['manifest-artifact-id'] }}
          path: ${{ runner.temp }}/zotwatch-private
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ github.run_id }}
          merge-multiple: true

      - name: Download exact recommendation artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          artifact-ids: ${{ inputs['report-artifact-id'] }}
          path: ${{ runner.temp }}/zotwatch-reports
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ github.run_id }}
          merge-multiple: true

      - name: Materialize closed Pages allowlist
        shell: bash
        run: >-
          python -m zotwatch.workflow pages
          --private "$RUNNER_TEMP/zotwatch-private"
          --reports "$RUNNER_TEMP/zotwatch-reports"
          --destination "$RUNNER_TEMP/zotwatch-pages"
          --engine-sha '${{ inputs['expected-engine-sha'] }}'
          --repository '${{ github.repository }}'
          --repository-id '${{ github.repository_id }}'
          --caller-run-id '${{ github.run_id }}'
          --run-id '${{ inputs['run-id'] }}'

      - name: Configure Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa
        with:
          path: ${{ runner.temp }}/zotwatch-pages

      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e
