name: E1 packaging and E2 config

on:
  pull_request:
  push:
    branches: [codex/v2, codex/v2-e1, codex/v2-e2, codex/v2-e4, codex/v2-e5a]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  installed-engine:
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    env:
      PYTHONHASHSEED: "0"
      PYTHONDONTWRITEBYTECODE: "1"
      TZ: UTC
      OMP_NUM_THREADS: "1"
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
      E1_INSTALLATION_REQUIRED: "1"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11.11"
      - name: Install verification tools
        run: python -m pip install -r tests/requirements.txt -r tests/packaging-requirements.txt
      - name: Build sdist and wheel from sdist
        run: python -m build --no-isolation --outdir "$RUNNER_TEMP/e1-dist"
      - name: Install wheel with full runtime dependencies
        run: |
          python -m venv "$RUNNER_TEMP/e1-wheel"
          "$RUNNER_TEMP/e1-wheel/bin/python" -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          "$RUNNER_TEMP/e1-wheel/bin/python" -m pip install -c tests/requirements.txt -r tests/requirements.txt "$RUNNER_TEMP/e1-dist/zotwatch-2.0.0.dev1-py3-none-any.whl"
          "$RUNNER_TEMP/e1-wheel/bin/python" -m pip check
          "$RUNNER_TEMP/e1-wheel/bin/python" -m pip freeze --exclude ZotWatch > "$RUNNER_TEMP/e1-resolved.txt"
      - name: Install editable with matching dependencies
        run: |
          python -m venv "$RUNNER_TEMP/e1-editable"
          "$RUNNER_TEMP/e1-editable/bin/python" -m pip install --extra-index-url https://download.pytorch.org/whl/cpu -r "$RUNNER_TEMP/e1-resolved.txt" -e .
          "$RUNNER_TEMP/e1-editable/bin/python" -m pip check
      - name: Verify installed engines outside checkout
        env:
          E1_WHEEL_PYTHON: ${{ runner.temp }}/e1-wheel/bin/python
          E1_EDITABLE_PYTHON: ${{ runner.temp }}/e1-editable/bin/python
          E1_DIST_DIR: ${{ runner.temp }}/e1-dist
        run: python -m pytest -c tests/pytest.ini -q
      - name: Verify immutable E0 inputs and expectations
        run: git diff --exit-code --diff-filter=DMR v2-e0-baseline -- tests/goldens tests/fixtures
