name: ZotWatch per-user latent staging compute

on:
  workflow_call:
    inputs:
      config-path:
        type: string
        default: zotwatch.yaml
      mode:
        type: string
        default: run
      full-rebuild:
        type: boolean
        default: false
      staging-audit:
        type: boolean
        default: false
      request-id:
        type: string
        default: ""
      expected-config-sha:
        type: string
        default: ""
      candidate-policy:
        type: string
        default: center-recall-v1
    secrets:
      ZOTERO_USER_ID:
        required: false
      ZOTERO_API_KEY:
        required: false
      LLM_API_KEY:
        required: false
      TYPESAFE_API_KEY:
        required: false
      ZOTWATCH_COMPATIBLE_API_KEY:
        required: false
      OPENALEX_API_KEY:
        required: false
      VOYAGE_API_KEY:
        required: false
      DASHSCOPE_API_KEY:
        required: false
      OPENROUTER_API_KEY:
        required: false
      DEEPSEEK_API_KEY:
        required: false
      OPENAI_API_KEY:
        required: false
      ANTHROPIC_API_KEY:
        required: false
      ZOTWATCH_CUSTOM_1_CREDENTIAL:
        required: false
      ZOTWATCH_CUSTOM_2_CREDENTIAL:
        required: false
      ZOTWATCH_CUSTOM_3_CREDENTIAL:
        required: false
      ZOTWATCH_CUSTOM_4_CREDENTIAL:
        required: false
    outputs:
      result-status:
        value: ${{ jobs.compute.outputs.result-status }}
      run-id:
        value: ${{ jobs.compute.outputs.run-id }}
      request-id:
        value: ${{ jobs.compute.outputs.request-id }}
      engine-sha:
        value: ${{ jobs.compute.outputs.engine-sha }}
      manifest-artifact-id:
        value: ${{ jobs.compute.outputs.manifest-artifact-id }}
      report-artifact-id:
        value: ${{ jobs.compute.outputs.report-artifact-id }}
      publish-requested:
        value: ${{ jobs.compute.outputs.publish-requested }}

permissions: {}

jobs:
  compute:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: read
    concurrency:
      group: zotwatch-${{ github.repository_id }}-${{ github.workflow_ref }}-${{ github.ref }}
      cancel-in-progress: false
    outputs:
      result-status: ${{ steps.aggregate.outputs.result-status }}
      run-id: ${{ steps.aggregate.outputs.run-id }}
      request-id: ${{ steps.request.outputs.request-id }}
      engine-sha: ${{ steps.identity.outputs.engine-sha }}
      manifest-artifact-id: ${{ steps.upload-private.outputs.artifact-id }}
      report-artifact-id: ${{ steps.upload-report.outputs.artifact-id }}
      publish-requested: ${{ steps.config.outputs.publish-requested }}
    steps:
      - name: Validate caller boundary
        env:
          CALLER_EVENT: ${{ github.event_name }}
          CALLER_PRIVATE: ${{ github.event.repository.private }}
          CALLER_REF: ${{ github.ref }}
          INPUT_MODE: ${{ inputs.mode }}
          INPUT_FULL: ${{ inputs['full-rebuild'] }}
          INPUT_CANDIDATE_POLICY: ${{ inputs['candidate-policy'] }}
        shell: bash
        run: |
          set -euo pipefail
          python -c 'import os,sys; ok=os.environ["CALLER_EVENT"] in {"schedule","workflow_dispatch"} and os.environ["CALLER_PRIVATE"] == "true" and os.environ["CALLER_REF"].startswith("refs/heads/") and os.environ["INPUT_MODE"] in {"run","profile","validate"} and os.environ["INPUT_CANDIDATE_POLICY"] in {"confirmed-topic-candidates-v1","center-recall-v1"} and not (os.environ["INPUT_MODE"] == "validate" and os.environ["INPUT_FULL"] == "true"); sys.exit(0 if ok else "untrusted or invalid reusable-workflow invocation")'

      - name: Checkout personal workspace
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: ${{ github.repository }}
          ref: ${{ github.sha }}
          path: workspace
          persist-credentials: false

      - name: Select isolated latent-auto staging configuration
        shell: bash
        run: |
          set -euo pipefail
          # P2 keeps its exact zotwatch.yaml path; only this temporary checkout changes.
          if [[ -f workspace/zotwatch-latent-auto.yaml ]]; then
            cp -- workspace/zotwatch-latent-auto.yaml workspace/zotwatch.yaml
          fi

      - name: Checkout exact central engine
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: engine
          persist-credentials: false

      - name: Set up pinned Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: 3.11.11
          cache: pip
          cache-dependency-path: |
            engine/constraints/p2-runtime-linux-py311.txt
            engine/pyproject.toml

      - name: Install pinned validation runtime
        if: inputs.mode == 'validate'
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --constraint engine/constraints/p2-runtime-linux-py311.txt pydantic PyYAML jsonschema python-dotenv requests
          python -m pip install --disable-pip-version-check --no-deps ./engine

      - name: Install pinned engine runtime
        if: inputs.mode != 'validate'
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check torch==2.14.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install --disable-pip-version-check --constraint engine/constraints/p2-runtime-linux-py311.txt ./engine

      - name: Verify reusable workflow and engine identity
        id: identity
        shell: bash
        run: >-
          python -m zotwatch.workflow identity
          --workflow-repository '${{ job.workflow_repository }}'
          --workflow-sha '${{ job.workflow_sha }}'
          --engine "$GITHUB_WORKSPACE/engine"
          --github-output

      - name: Validate request correlation
        id: request
        env:
          INPUT_REQUEST_ID: ${{ inputs['request-id'] }}
          FALLBACK_REQUEST_ID: ${{ github.run_id }}-${{ github.run_attempt }}
        shell: bash
        run: |
          set -euo pipefail
          python -c 'import os,re; v=os.environ["INPUT_REQUEST_ID"] or os.environ["FALLBACK_REQUEST_ID"]; assert re.fullmatch(r"[A-Za-z0-9][A-Za-z0-9._-]{0,127}",v); open(os.environ["GITHUB_OUTPUT"],"a",encoding="utf-8").write(f"request-id={v}\n")'

      - name: Validate and inspect config offline
        id: config
        env:
          INPUT_CONFIG_PATH: ${{ inputs['config-path'] }}
          INPUT_EXPECTED_CONFIG_SHA: ${{ inputs['expected-config-sha'] }}
        shell: bash
        run: >-
          python -m zotwatch.workflow inspect-config
          --workspace "$GITHUB_WORKSPACE/workspace"
          --config-path "$INPUT_CONFIG_PATH"
          --expected-config-sha "$INPUT_EXPECTED_CONFIG_SHA"
          --mode '${{ inputs.mode }}'
          --full-rebuild '${{ inputs['full-rebuild'] }}'
          --github-output

      - name: Require latent-auto configuration for per-user lifecycle
        if: inputs.mode != 'validate'
        env:
          RANKING_POLICY: ${{ steps.config.outputs.ranking-policy }}
          CANDIDATE_POLICY: ${{ inputs['candidate-policy'] }}
        shell: bash
        run: |
          test "$RANKING_POLICY" = latent-auto-v1
          test "$CANDIDATE_POLICY" = center-recall-v1

      - name: Validate config only
        if: inputs.mode == 'validate'
        shell: bash
        run: zotwatch config validate --workspace "$GITHUB_WORKSPACE/workspace"

      - name: Restore prior private checkpoint
        if: inputs.mode != 'validate'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: >-
          python -m zotwatch.workflow restore
          --repository '${{ github.repository }}'
          --repository-id '${{ github.repository_id }}'
          --run-id '${{ github.run_id }}'
          --run-attempt '${{ github.run_attempt }}'
          --ref '${{ github.ref }}'
          --event '${{ github.event_name }}'
          --workspace "$GITHUB_WORKSPACE/workspace"
          --state "$RUNNER_TEMP/zotwatch-state"
          --staging "$RUNNER_TEMP/zotwatch-restore"
          --context-output "$RUNNER_TEMP/zotwatch-workflow-context.json"

      - name: Restore durable private per-user latent state
        if: inputs.mode != 'validate'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: >-
          python -m zotwatch.interests.lifecycle_transport restore
          --state "$RUNNER_TEMP/zotwatch-state"

      - name: Restore independent durable DOI metadata cache
        if: inputs.mode != 'validate'
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: python -m zotwatch.metadata_transport restore --state "$RUNNER_TEMP/zotwatch-state"

      - name: Deliver exact generic MiniLM encoder
        if: inputs.mode != 'validate'
        shell: bash
        run: >-
          python -m zotwatch.interests.lifecycle_transport encoder
          --cache "$RUNNER_TEMP/zotwatch-encoder/hub"

      - name: Run engine
        if: inputs.mode != 'validate'
        id: invoke
        env:
          ZOTWATCH_PRIVATE_FILTER_DIAGNOSTIC: "1"
          GITHUB_TOKEN: ${{ github.token }}
          INPUT_RANKING_POLICY: ${{ steps.config.outputs.ranking-policy }}
          OPENALEX_API_KEY: ${{ secrets.OPENALEX_API_KEY }}
          ZOTERO_USER_ID: ${{ secrets.ZOTERO_USER_ID }}
          ZOTERO_API_KEY: ${{ secrets.ZOTERO_API_KEY }}
          VOYAGE_API_KEY: ${{ secrets.VOYAGE_API_KEY }}
          DASHSCOPE_API_KEY: ${{ secrets.DASHSCOPE_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ZOTWATCH_CUSTOM_1_CREDENTIAL: ${{ secrets.ZOTWATCH_CUSTOM_1_CREDENTIAL }}
          ZOTWATCH_CUSTOM_2_CREDENTIAL: ${{ secrets.ZOTWATCH_CUSTOM_2_CREDENTIAL }}
          ZOTWATCH_CUSTOM_3_CREDENTIAL: ${{ secrets.ZOTWATCH_CUSTOM_3_CREDENTIAL }}
          ZOTWATCH_CUSTOM_4_CREDENTIAL: ${{ secrets.ZOTWATCH_CUSTOM_4_CREDENTIAL }}
          INPUT_MODE: ${{ inputs.mode }}
          INPUT_FULL: ${{ inputs['full-rebuild'] }}
          INPUT_CANDIDATE_POLICY: ${{ inputs['candidate-policy'] }}
        shell: bash
        run: |
          set +e
          export HF_HUB_CACHE="$RUNNER_TEMP/zotwatch-encoder/hub"
          export HF_HUB_OFFLINE=1 TRANSFORMERS_OFFLINE=1
          command=watch
          extra=(--latent-lifecycle per-user-v1 --latent-encoder-cache "$RUNNER_TEMP/zotwatch-encoder/hub")
          if [[ "$INPUT_FULL" == "true" ]]; then extra+=(--full); fi
          if [[ "$INPUT_MODE" == "profile" ]]; then
            command=profile
            if [[ "$INPUT_FULL" == "true" ]]; then extra+=(--full); fi
          fi
          if [[ "$command" == "watch" && "$INPUT_CANDIDATE_POLICY" == "center-recall-v1" ]]; then
            extra+=(--candidate-policy center-recall-v1)
            export HF_HUB_CACHE="$RUNNER_TEMP/zotwatch-encoder/hub"
            export HF_HUB_OFFLINE=1 TRANSFORMERS_OFFLINE=1
          fi
          zotwatch "$command" --workspace "$GITHUB_WORKSPACE/workspace" --state-dir "$RUNNER_TEMP/zotwatch-state" --reports-dir "$RUNNER_TEMP/zotwatch-reports" --machine-result "${extra[@]}" >"$RUNNER_TEMP/machine-result.json" 2>"$RUNNER_TEMP/engine.stderr"
          code=$?
          echo "exit-code=$code" >>"$GITHUB_OUTPUT"
          exit 0

      - name: Persist validated per-user latent generations with remote CAS
        if: inputs.mode != 'validate' && steps.invoke.outcome == 'success'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f "$RUNNER_TEMP/zotwatch-state/latent-state-v1/current.json" ]]; then
            python -m zotwatch.interests.lifecycle_transport publish --state "$RUNNER_TEMP/zotwatch-state"
          fi

      - name: Persist independent DOI metadata cache with remote CAS
        if: inputs.mode != 'validate' && steps.invoke.outcome == 'success'
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f "$RUNNER_TEMP/zotwatch-state/metadata-cache-v1.json" && -f "$RUNNER_TEMP/zotwatch-state/metadata-remote-v1.json" ]]; then
            python -m zotwatch.metadata_transport publish --state "$RUNNER_TEMP/zotwatch-state"
          fi

      - name: Validate finalized engine result
        if: steps.invoke.outcome == 'success'
        id: result
        shell: bash
        run: >-
          python -m zotwatch.workflow result
          --machine-result "$RUNNER_TEMP/machine-result.json"
          --process-exit-code '${{ steps.invoke.outputs.exit-code }}'
          --state "$RUNNER_TEMP/zotwatch-state"
          --reports "$RUNNER_TEMP/zotwatch-reports"
          --publishable "$RUNNER_TEMP/zotwatch-publishable"
          --private "$RUNNER_TEMP/zotwatch-operational/final"
          --summary-output "$RUNNER_TEMP/result-summary.json"
          --github-output

      - name: Restore independent translation cache
        if: inputs.mode == 'run'
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ${{ runner.temp }}/zotwatch-state/optional-ai-cache-v1/translation-cache-v1.json
          key: zotwatch-translation-${{ github.repository_id }}-v1-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: zotwatch-translation-${{ github.repository_id }}-v1-

      - name: Restore independent selected-provider judgment caches
        if: inputs.mode == 'run'
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            ${{ runner.temp }}/zotwatch-state/optional-ai-cache-v1/quality-llm-cache-v1.json
            ${{ runner.temp }}/zotwatch-state/optional-ai-cache-v1/jev-cache-v1.json
          key: zotwatch-quality-${{ github.repository_id }}-v1-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: zotwatch-quality-${{ github.repository_id }}-v1-

      - name: Apply optional staging AI delivery after original Top 20
        if: inputs.mode == 'run' && steps.result.outputs.status == 'succeeded'
        env:
          LLM_API_FORMAT: ${{ vars.LLM_API_FORMAT || 'openai' }}
          LLM_BASE_URL: ${{ vars.LLM_BASE_URL }}
          LLM_MODEL: ${{ vars.LLM_MODEL }}
          LLM_TRANSLATION_MODEL: ${{ vars.LLM_TRANSLATION_MODEL }}
          LLM_SHADOW_MODEL: ${{ vars.LLM_SHADOW_MODEL }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          ZOTWATCH_COMPATIBLE_API_KEY: ${{ secrets.ZOTWATCH_COMPATIBLE_API_KEY }}
        shell: bash
        run: >-
          python -m zotwatch.staging_ai
          --config "$GITHUB_WORKSPACE/workspace/zotwatch-optional-ai.yaml"
          --result "$RUNNER_TEMP/machine-result.json"
          --state "$RUNNER_TEMP/zotwatch-state"
          --destination "$RUNNER_TEMP/zotwatch-operational"

      - name: Select authoritative result
        id: aggregate
        env:
          MODE: ${{ inputs.mode }}
          MAIN_STATUS: ${{ steps.result.outputs.status }}
          MAIN_RUN_ID: ${{ steps.result.outputs.run-id }}
          PROFILE_STATUS: ${{ steps.pre-profile-result.outputs.status }}
          PROFILE_RUN_ID: ${{ steps.pre-profile-result.outputs.run-id }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$MODE" == "validate" ]]; then
            echo "result-status=succeeded" >>"$GITHUB_OUTPUT"
            echo "run-id=" >>"$GITHUB_OUTPUT"
          elif [[ -n "$MAIN_STATUS" ]]; then
            echo "result-status=$MAIN_STATUS" >>"$GITHUB_OUTPUT"
            echo "run-id=$MAIN_RUN_ID" >>"$GITHUB_OUTPUT"
          else
            echo "result-status=$PROFILE_STATUS" >>"$GITHUB_OUTPUT"
            echo "run-id=$PROFILE_RUN_ID" >>"$GITHUB_OUTPUT"
          fi

      - name: Seal private operational result
        if: inputs.mode != 'validate' && steps.aggregate.outputs.result-status != ''
        shell: bash
        run: >-
          python -m zotwatch.workflow seal-result
          --private "$RUNNER_TEMP/zotwatch-operational"
          --engine-sha '${{ steps.identity.outputs.engine-sha }}'
          --repository '${{ github.repository }}'
          --repository-id '${{ github.repository_id }}'
          --caller-run-id '${{ github.run_id }}'
          --run-id '${{ steps.aggregate.outputs.run-id }}'
          --status '${{ steps.aggregate.outputs.result-status }}'
          --publish-requested '${{ steps.config.outputs.publish-requested }}'

      - name: Upload private operational result
        if: inputs.mode != 'validate' && steps.aggregate.outputs.result-status != ''
        id: upload-private
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: zotwatch-private-per-user-latent-run-v1
          path: ${{ runner.temp }}/zotwatch-operational
          if-no-files-found: error
          retention-days: 30

      - name: Export successful private checkpoint
        if: steps.aggregate.outputs.result-status == 'succeeded' && inputs.mode != 'validate'
        shell: bash
        run: >-
          python -m zotwatch.workflow export-checkpoint
          --context "$RUNNER_TEMP/zotwatch-workflow-context.json"
          --engine-sha '${{ steps.identity.outputs.engine-sha }}'
          --engine-run-id '${{ steps.aggregate.outputs.run-id }}'
          --config-fingerprint '${{ steps.config.outputs.config-fingerprint-sha256 }}'
          --state "$RUNNER_TEMP/zotwatch-state"
          --destination "$RUNNER_TEMP/zotwatch-checkpoint"

      - name: Upload successful private checkpoint
        if: steps.aggregate.outputs.result-status == 'succeeded' && inputs.mode != 'validate'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: zotwatch-state-checkpoint-v1
          path: ${{ runner.temp }}/zotwatch-checkpoint
          if-no-files-found: error
          retention-days: 30
          overwrite: true

      - name: Upload private latent-auto filter evidence
        if: steps.invoke.outcome == 'success'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: zotwatch-private-latent-auto-diagnostic-v1
          path: ${{ runner.temp }}/zotwatch-state/runs/filter-diagnostic-*.json
          if-no-files-found: ignore
          retention-days: 30

      - name: Propagate engine result
        if: inputs.mode != 'validate' && steps.aggregate.outputs.result-status != 'succeeded' && steps.aggregate.outputs.result-status != 'not_ready' && steps.aggregate.outputs.result-status != 'paused'
        shell: bash
        run: exit 1
