schema_version: 2
zotero:
  library_type: user
candidates:
  provider: public-api-v1
  sources: [crossref]
  window_days: 7
ranking:
  policy: legacy-v1
  top_n: 20
  max_preprint_ratio: 0.3
embedding:
  provider: local
  model: sentence-transformers/all-MiniLM-L6-v2
ai:
  services:
    summary-service:
      provider: openrouter
      model: user-model
      api_key_env: OPENROUTER_API_KEY
  features:
    rerank: {enabled: false}
    summary: {enabled: true, service: summary-service}
outputs:
  formats: [json]
  publish: false
