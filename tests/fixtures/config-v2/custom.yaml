schema_version: 2
zotero:
  library_type: user
candidates:
  provider: public-api-v1
  sources: [crossref, arxiv, biorxiv]
  window_days: 7
ranking:
  policy: legacy-v1
  top_n: 20
  max_preprint_ratio: 0.3
embedding:
  provider: local
  model: sentence-transformers/all-MiniLM-L6-v2
ai:
  services:
    summary-service:
      provider: custom
      protocol: openai-compatible-generation
      base_url: https://gateway.example.invalid/v1
      model: user-entered-generation-model
      connection_id: custom-1
  features:
    rerank: {enabled: false}
    summary: {enabled: true, service: summary-service}
outputs:
  formats: [rss, html, json]
  publish: false
