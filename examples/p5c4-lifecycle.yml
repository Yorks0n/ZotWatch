# Install as .github/workflows/p5c4-lifecycle.yml in a private staging workspace.
# profile: sync/bootstrap; run: recommend after Confirm, then restore/reuse.
name: ZotWatch per-user staging
on:
  workflow_dispatch:
    inputs:
      mode:
        description: profile (sync/bootstrap) or run (recommendation after Confirm)
        type: choice
        default: profile
        options: [profile, run]
permissions:
  contents: write
  actions: read
jobs:
  lifecycle:
    uses: Yorks0n/ZotWatch/.github/workflows/per-user-latent-staging.yml@90acd6867fd481930cbb055fd7f16d38538711e9
    with:
      config-path: zotwatch.yaml
      mode: ${{ inputs.mode }}
      candidate-policy: center-recall-v1
    secrets:
      ZOTERO_USER_ID: ${{ secrets.ZOTERO_USER_ID }}
      ZOTERO_API_KEY: ${{ secrets.ZOTERO_API_KEY }}
