# Install as .github/workflows/p5c4-lifecycle.yml in the private staging workspace.
name: ZotWatch per-user staging
on:
  workflow_dispatch:
  schedule:
    # Daily at 23:23 Asia/Shanghai; GitHub executes the default-branch caller.
    - cron: "23 15 * * *"
permissions:
  contents: write
  actions: read
jobs:
  lifecycle:
    uses: Yorks0n/ZotWatch/.github/workflows/per-user-latent-staging.yml@37ee8b8f53266a9f46f7003e6d7d180499be8b3f
    with:
      config-path: zotwatch.yaml
      mode: run
      candidate-policy: center-recall-v1
    secrets:
      ZOTERO_USER_ID: ${{ secrets.ZOTERO_USER_ID }}
      ZOTERO_API_KEY: ${{ secrets.ZOTERO_API_KEY }}
